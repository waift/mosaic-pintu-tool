<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MOSAIC · 拼图工具</title>
    <script>
      // 在 React 渲染前同步设置主题,避免刷新闪一帧黑/白
      (function () {
        try {
          var stored = localStorage.getItem("mosaic-theme");
          var prefersLight =
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: light)").matches;
          var theme = stored === "dark" || stored === "light"
            ? stored
            : (prefersLight ? "light" : "dark");
          var root = document.documentElement;
          root.classList.remove("dark", "light");
          root.classList.add(theme);
          // 同步预设背景色,消除首帧默认白底闪烁
          if (theme === "light") {
            root.style.backgroundColor = "#f0f0ea";
            root.style.color = "#1a1a1f";
          } else {
            root.style.backgroundColor = "#0e0e12";
            root.style.color = "#f5f5f0";
          }
        } catch (e) {}
      })();
    </script>
    <script type="module">
      if (import.meta.hot?.on) {
        import.meta.hot.on('vite:error', (error) => {
          if (error.err) {
            console.error(
              [error.err.message, error.err.frame].filter(Boolean).join('\n'),
            )
          }
        })
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
