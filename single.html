<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MOSAIC · 拼图工具</title>
    <script>
      // 在 React 渲染前同步设置主题,避免刷新闪一帧黑/白
      (function () {
        try {
          var stored = localStorage.getItem("mosaic-theme");
          var prefersLight =
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: light)").matches;
          var theme = stored === "dark" || stored === "light"
            ? stored
            : (prefersLight ? "light" : "dark");
          var root = document.documentElement;
          root.classList.remove("dark", "light");
          root.classList.add(theme);
          if (theme === "light") {
            root.style.backgroundColor = "#f0f0ea";
            root.style.color = "#1a1a1f";
          } else {
            root.style.backgroundColor = "#0e0e12";
            root.style.color = "#f5f5f0";
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/single.tsx"></script>
  </body>
</html>
